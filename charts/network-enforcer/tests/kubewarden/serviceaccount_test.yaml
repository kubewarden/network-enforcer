suite: "Values contract: ServiceAccount annotations"
templates:
  - templates/controller/serviceaccount.yaml
  - templates/ztunnel-log-reader/serviceaccount.yaml
tests:
  - it: applies global service account annotations to controller and agent identities
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: scanner
    asserts:
      - equal:
          path: metadata.annotations["example.com/role"]
          value: scanner

  - it: renders no ServiceAccount annotations by default
    asserts:
      - notExists:
          path: metadata.annotations
        template: templates/controller/serviceaccount.yaml
      - notExists:
          path: metadata.annotations
        template: templates/ztunnel-log-reader/serviceaccount.yaml

  - it: applies common ServiceAccount annotations to both identities
    set:
      common:
        serviceAccount:
          annotations:
            example.com/role: common
    asserts:
      - equal:
          path: metadata.annotations["example.com/role"]
          value: common

  - it: applies controller-only ServiceAccount annotations to the controller identity
    set:
      controller:
        serviceAccount:
          annotations:
            example.com/controller-role: controller
    asserts:
      - equal:
          path: metadata.annotations["example.com/controller-role"]
          value: controller
        template: templates/controller/serviceaccount.yaml
      - notExists:
          path: metadata.annotations["example.com/controller-role"]
        template: templates/ztunnel-log-reader/serviceaccount.yaml

  - it: applies a nested agent annotation only to the agent ServiceAccount
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: global
      controller:
        provider:
          istio:
            agent:
              serviceAccount:
                annotations:
                  example.com/role: agent
    asserts:
      - equal:
          path: metadata.annotations["example.com/role"]
          value: agent
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: metadata.annotations["example.com/role"]
          value: global
        template: templates/controller/serviceaccount.yaml

  - it: merges ServiceAccount annotations with the workload value winning on duplicate keys
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: global
            example.com/global: "yes"
      common:
        serviceAccount:
          annotations:
            example.com/role: common
            example.com/common: "yes"
      controller:
        provider:
          istio:
            agent:
              serviceAccount:
                annotations:
                  example.com/role: agent
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/role: common
            example.com/global: "yes"
            example.com/common: "yes"
        template: templates/controller/serviceaccount.yaml
      - equal:
          path: metadata.annotations
          value:
            example.com/role: agent
            example.com/global: "yes"
            example.com/common: "yes"
        template: templates/ztunnel-log-reader/serviceaccount.yaml
