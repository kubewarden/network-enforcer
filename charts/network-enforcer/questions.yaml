# This is a Rancher questions file
---
questions:
  ###############################################################################
  # General
  ###############################################################################
  - variable: global.imagePullPolicy
    type: enum
    options:
      - Always
      - IfNotPresent
      - Never
    default: IfNotPresent
    label: Image Pull Policy
    description: |
      Pull policy of the images of all workloads
    group: General

  ###############################################################################
  # Controller
  ###############################################################################
  - variable: controller.replicas
    type: int
    default: 1
    min: 1
    label: Controller Replicas
    description: |
      Number of replicas of the Controller Deployment
    group: Controller

  ###############################################################################
  # Provider
  ###############################################################################
  - variable: controller.provider.name
    type: enum
    options:
      - istio
      - cilium
      - calico
    default: istio
    required: true
    label: Data-plane Provider
    description: |
      The data-plane provider the controller reads network flows from.
      "istio" pulls typed ztunnel events from the agent DaemonSet, "cilium" uses Hubble Relay, and "calico" uses Goldmane.
      The ztunnel log reader is enabled by default under controller.provider.istio.agent and reads node logs through hostPath mounts; the release namespace admission policy must permit this workload. Istio agent mTLS is chart-managed; endpoint and TLS values apply to Cilium and Calico.
    group: Provider

  # Configure controller.provider.<name>.endpoint and controller.provider.<name>.tls
  # directly in values.yaml.

  ###############################################################################
  # Telemetry
  ###############################################################################
  - variable: global.otel.endpoint
    type: string
    default: ""
    label: OTLP Endpoint
    description: |
      OTLP gRPC endpoint to export telemetry to, e.g. http://otel-collector:4317
      (plaintext) or https://otel-collector:4317 (TLS). Leave empty to disable
      telemetry export.
      The chart does not deploy a collector.
    group: Telemetry

  - variable: global.otel.caSecretName
    type: string
    default: ""
    label: CA certificate secret
    description: |
      Secret with the CA certificate that verifies the collector certificate.
      The secret must contain the key `ca.crt`.
      Without this secret, TLS trusts only public CAs.
      A collector with a certificate from an internal CA needs this secret.
    group: Telemetry

  - variable: global.otel.clientCertificateSecretName
    type: string
    default: ""
    label: Client certificate secret
    description: |
      Secret with the client certificate for mTLS with the collector.
      The secret must contain the keys `tls.crt` and `tls.key`.
    group: Telemetry
