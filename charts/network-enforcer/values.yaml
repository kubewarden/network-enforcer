# nameOverride replaces the chart name used when generating resource names,
# while still keeping the release name as a prefix (e.g. `<release-name>-<nameOverride>`).
# Leave empty to use the chart name.
nameOverride: ""
# fullnameOverride fully replaces the generated resource name prefix
# (`<release-name>-<chart-name>`) for all resources created by this chart.
# Leave empty to use the default generated name.
fullnameOverride: ""

controller:
  # @schema enum: [debug, info, warn, error]
  logLevel: info
  # controller.env -- Additional environment variables
  env: []
  # The containerSecurityContext used by the network-enforcer controller
  # @schema additionalProperties:true
  containerSecurityContext:
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  image:
    # The image path used by controller
    # @schema required
    repository: ghcr.io/kubewarden/network-enforcer/controller
    # The image tag used by controller
    # @schema required
    tag: v0.2.0
    pullPolicy: IfNotPresent
  # To make the Pods "Guaranteed" (evicted last under node pressure), kubelet requires
  # requests and limits are specified for all the containers and they are equal.
  # Please refer to https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#pod-selection-for-kubelet-eviction
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # The podSecurityContext used by the network-enforcer controller
  # @schema additionalProperties:true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  serviceAccount:
    # controller.serviceAccount.annotations -- Additional annotations to add to controller's service account.
    # @schema additionalProperties:true
    annotations: {}
  # controller.tolerations -- Tolerations to apply on the controller pods
  tolerations: []
  # controller.podLabels -- Additional labels to add to the controller pods.
  # @schema additionalProperties:true
  podLabels: {}
  # controller.podAnnotations -- Additional annotations to add to the controller pods.
  # @schema additionalProperties:true
  podAnnotations: {}
  # controller.nodeSelector -- Node selector for the controller pods.
  # @schema additionalProperties:true
  nodeSelector: {}
  # controller.affinity -- Affinity rules for the controller pods.
  # @schema additionalProperties:true
  affinity: {}
  provider:
    # @schema required
    # @schema enum: [istio, cilium, calico]
    name: istio
    # Provider defaults when endpoint is empty:
    # istio  -> 4317
    # cilium -> hubble-relay.kube-system.svc:443, or :80 when tls.mode=insecure
    # calico -> goldmane.calico-system.svc:7443
    #
    # @schema type: [integer, string]
    endpoint: ""
    tls:
      # auto resolves to issuer for istio, existingSecret for cilium and calico,
      # insecure otherwise.
      # @schema enum: [issuer, existingSecret, insecure, auto]
      mode: auto
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
      existingSecret:
        # Defaults: cilium -> hubble-relay-client-certs in kube-system;
        # calico -> goldmane-key-pair in calico-system.
        name: ""
        # Empty means the release namespace, and the Secret is mounted instead of read via the API.
        namespace: ""
        # Optional ConfigMap in existingSecret.namespace holding the CA bundle.
        # Calico defaults to goldmane-ca-bundle (CA key ca.crt or tigera-ca-bundle.crt).
        caBundleConfigMap: ""
      # Empty means the endpoint host, except cilium, which uses ui.hubble-relay.cilium.io.
      serverName: ""
    # Settings that apply only when controller.provider.name is istio.
    istio:
      # The fluent-bit DaemonSet that ships ztunnel logs to the controller.
      fluentBit:
        image:
          # The image path used by fluent-bit
          # @schema required
          repository: fluent/fluent-bit
          # The image tag used by fluent-bit
          # @schema required
          tag: 5.1.2
          pullPolicy: IfNotPresent
  wnpStatusUpdateInterval: 30s
  flowDumper:
    enabled: false
    port: 9080
    bufferSize: 10000

kubernetesClusterDomain: cluster.local

# Optional array of imagePullSecrets containing private registry credentials
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# Each entry can be a plain secret name (string) or a {name: ...} object.
imagePullSecrets: []

telemetry:
  collectorStrategy: "default" # @schema enum: [none, default, external]
  defaultCollector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.161.0
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  externalCollector:
    # telemetry.externalCollector.endpoint is the Otel collector endpoint to send signals to.
    # For gRPC, it should be in the format <hostname>:<port>.
    # For HTTP, it should be in the format http(s)://<hostname>:<port>.
    endpoint: ""
    # telemetry.externalCollector.protocol is the protocol to use for the Otel collector.
    protocol: "grpc" # @schema enum: [grpc, http/protobuf]
    # The following settings are required to configure the OpenTelemetry exporter
    # to send signals to a remote collector using TLS.
    # Both secrets must be created in the same namespace where the controller is deployed.
    #
    # If otelCollectorCertificateSecret is not set, TLS verification is disabled
    # (insecure mode). When set, the certificate is used to validate the remote
    # collector.
    #
    # telemetry.externalCollector.otelCollectorCertificateSecret should contain a key ca.crt
    # storing the certificate to validate the remote collector certificate.
    otelCollectorCertificateSecret: ""
    # telemetry.externalCollector.otelCollectorClientCertificateSecret is optional.
    # Only required when the remote collector requires client authentication (mTLS).
    # The secret should contain the keys `tls.crt` and `tls.key`.
    otelCollectorClientCertificateSecret: ""
