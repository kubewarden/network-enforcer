suite: "Values contract: PriorityClass"
templates:
  - "templates/priorityclass/priorityclass.yaml"
  - "templates/controller/deployment.yaml"
  - "templates/istio-fluent-bit/daemonset.yaml"
  # The DaemonSet computes a checksum of the ConfigMap, so the ConfigMap must render too.
  # Every assertion below names its template, so the ConfigMap is not checked.
  - "templates/istio-fluent-bit/configmap.yaml"
tests:
  - it: "should render the PriorityClass and reference it from the controller and the fluent-bit DaemonSet by default"
    asserts:
      - hasDocuments:
          count: 1
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: metadata.name
          value: network-enforcer-priorityclass
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should not render the PriorityClass but keep the reference when priorityClass.enabled is false"
    set:
      priorityClass:
        enabled: false
        name: existing-priority
    asserts:
      - hasDocuments:
          count: 0
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: existing-priority
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: existing-priority
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should not render the PriorityClass when priorityClass.name is empty"
    set:
      priorityClass:
        name: ""
    asserts:
      - hasDocuments:
          count: 0
        template: "templates/priorityclass/priorityclass.yaml"
      - notExists:
          path: spec.template.spec.priorityClassName
        template: "templates/controller/deployment.yaml"
      - notExists:
          path: spec.template.spec.priorityClassName
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should keep the PriorityClass and use global.priorityClassName on every workload"
    set:
      global:
        priorityClassName: system-cluster-critical
    asserts:
      - hasDocuments:
          count: 1
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should use common.priorityClassName on every workload"
    set:
      global:
        priorityClassName: global-priority
      common:
        priorityClassName: system-cluster-critical
    asserts:
      - hasDocuments:
          count: 1
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should keep the chart PriorityClass on the fluent-bit DaemonSet with a controller-only priorityClassName"
    set:
      controller:
        priorityClassName: controller-priority
    asserts:
      - hasDocuments:
          count: 1
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: controller-priority
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: "templates/istio-fluent-bit/daemonset.yaml"

  - it: "should prefer the workload priorityClassName over global"
    set:
      global:
        priorityClassName: global-priority
      common:
        priorityClassName: common-priority
      istioFluentBit:
        priorityClassName: system-node-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-node-critical
        template: "templates/istio-fluent-bit/daemonset.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: common-priority
        template: "templates/controller/deployment.yaml"

  # Cases moved from the previous PriorityClass suite.
  - it: "should render the PriorityClass spec with defaults"
    asserts:
      - isKind:
          of: PriorityClass
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: value
          value: 1000000
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: globalDefault
          value: false
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: description
          value: PriorityClass for network-enforcer controller and fluent-bit pods.
        template: "templates/priorityclass/priorityclass.yaml"

  - it: "should allow name and value override"
    set:
      priorityClass:
        name: custom-priorityclass
        value: 500000
    asserts:
      - equal:
          path: metadata.name
          value: custom-priorityclass
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: value
          value: 500000
        template: "templates/priorityclass/priorityclass.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: custom-priorityclass
        template: "templates/controller/deployment.yaml"
      - equal:
          path: spec.template.spec.priorityClassName
          value: custom-priorityclass
        template: "templates/istio-fluent-bit/daemonset.yaml"
