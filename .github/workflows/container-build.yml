name: Build, Sign, and Generate SBOM, Attestation & Provenance

on:
  workflow_call:
    inputs:
      version:
        type: string

  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      matrix:
        component: [controller, cniwatcher]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write    # Push images to ghcr.io
      id-token: write    # Sign images with cosign (OIDC)
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        uses: rancher-sandbox/runtime-enforcer/.github/actions/container-build@57cc5aeb8c5d00c59ed40b4532c5c645b0311101
        with:
          arch: ${{ matrix.arch }}
          dockerfile: package/Dockerfile.${{ matrix.component }}
          image: ${{ matrix.component }}
          repo: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [controller, cniwatcher]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Merge images
        uses: rancher-sandbox/runtime-enforcer/.github/actions/merge-multiarch@f796011845359dd1410cb0e55a1e7e7cced32234
        with:
          arch: amd64,arm64
          image: ${{ matrix.component }}
          repo: ${{ github.repository }}
          tag: ${{ inputs.version || 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
