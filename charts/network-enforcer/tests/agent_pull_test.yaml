suite: ztunnel log reader pull configuration
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
chart:
  version: 1.0.0
release:
  name: network-enforcer
  namespace: network-enforcer
tests:
  - it: configures discovery and authenticated transport for Istio by default
    template: templates/controller/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-namespace=network-enforcer
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-label-selector=app.kubernetes.io/name=network-enforcer,app.kubernetes.io/instance=network-enforcer,app.kubernetes.io/component=agent
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-port=50052
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-enabled=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: grpc-certs
            mountPath: /etc/network-enforcer/certs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: network-enforcer-ca
                csi.cert-manager.io/issuer-kind: Issuer
                csi.cert-manager.io/dns-names: network-enforcer-controller
                csi.cert-manager.io/fs-group: "65532"

  - it: uses matching nested ports and mTLS identities for controller and agent
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: 50123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-port=50123
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-port=50123
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --grpc-mtls-enabled=true
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-expected-client-san=network-enforcer-controller
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: honors release, name and namespace overrides in the discovery selector
    release:
      name: blue-installation
      namespace: release-namespace
    set:
      nameOverride: custom-name
      namespaceOverride: agent-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: agent-namespace
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: agent-namespace
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-label-selector=app.kubernetes.io/name=custom-name,app.kubernetes.io/instance=blue-installation,app.kubernetes.io/component=agent
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: agent
            app.kubernetes.io/name: custom-name
            app.kubernetes.io/instance: blue-installation
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: keeps agent workload and controller pull flags out of non-Istio providers
    set:
      controller:
        provider:
          name: cilium
          istio:
            agent:
              enabled: true
              grpcPort: 50123
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-port=50123
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
          any: true
        template: templates/controller/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: rejects an agent port below the schema minimum
    template: templates/controller/deployment.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: 0
    asserts:
      - failedTemplate:
          errorPattern: "minimum: got 0, want 1"

  - it: rejects an agent port above the schema maximum
    template: templates/controller/deployment.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: 65536
    asserts:
      - failedTemplate:
          errorPattern: "maximum: got 65,536, want 65,535"

  - it: rejects an agent port with the wrong type
    template: templates/controller/deployment.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: wrong
    asserts:
      - failedTemplate:
          errorPattern: "got string, want integer"
