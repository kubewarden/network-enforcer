suite: ztunnel log reader deployment and security
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
templates:
  - templates/ztunnel-log-reader/daemonset.yaml
  - templates/ztunnel-log-reader/serviceaccount.yaml
  - templates/controller/deployment.yaml
  - templates/istio-fluent-bit/daemonset.yaml
  - templates/istio-fluent-bit/configmap.yaml
  - templates/istio-fluent-bit/serviceaccount.yaml
tests:
  - it: deploys exactly one ztunnel log reader DaemonSet and a dedicated tokenless ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: metadata.name
          value: my-release-network-enforcer-agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-network-enforcer-agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: metadata.name
          value: my-release-network-enforcer-agent
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: agent
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: my-release
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - notExists:
          path: metadata["app.kubernetes.io/instance"]
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: templates/ztunnel-log-reader/serviceaccount.yaml

  - it: mounts only the two read-only log directories and CSI certificates
    template: templates/ztunnel-log-reader/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: varlog-pods
            mountPath: /var/log/pods
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: varlog-containers
            mountPath: /var/log/containers
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: varlog-pods
            hostPath:
              path: /var/log/pods
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: varlog-containers
            hostPath:
              path: /var/log/containers
              type: Directory
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: varlog
            hostPath:
              path: /var/log
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 3

  - it: pins the ztunnel matcher and identity settings while preserving explicit mTLS opt-out
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              args:
                - --poll-interval=1s
                - --log-glob=/tmp/forbidden/*.log
                - --grpc-mtls-enabled=false
                - --grpc-expected-client-san=custom-controller
                - --grpc-mtls-cert-dir=/custom/certs
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --poll-interval=1s
            - --log-glob=/tmp/forbidden/*.log
            - --grpc-mtls-enabled=false
            - --grpc-expected-client-san=custom-controller
            - --grpc-mtls-cert-dir=/custom/certs
            - --log-glob=/var/log/pods/istio-system_ztunnel-*/{ztunnel,istio-proxy}/*.log
            - --grpc-port=50052
            - --grpc-mtls-cert-dir=/etc/network-enforcer/certs
            - --grpc-expected-client-san=my-release-network-enforcer-controller

  - it: retains chart-owned identity and certificate SANs
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: 50123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-port=50123
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --grpc-mtls-enabled=true
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-expected-client-san=my-release-network-enforcer-controller
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: my-release-network-enforcer-ca
                csi.cert-manager.io/issuer-kind: Issuer
                csi.cert-manager.io/dns-names: ${POD_NAME}.${POD_NAMESPACE}
                csi.cert-manager.io/fs-group: "65532"
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: runs as root with the remaining container hardening
    template: templates/ztunnel-log-reader/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: does not render a local agent when disabled but the controller still has mTLS material
    set:
      controller:
        provider:
          istio:
            agent:
              enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: my-release-network-enforcer-ca
                csi.cert-manager.io/issuer-kind: Issuer
                csi.cert-manager.io/dns-names: my-release-network-enforcer-controller
                csi.cert-manager.io/fs-group: "65532"
        template: templates/controller/deployment.yaml

  - it: inherits common settings while allowing nested workload overrides
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      common:
        tolerations:
          - key: common
            operator: Exists
        nodeSelector:
          node-role: common
      controller:
        provider:
          istio:
            agent:
              tolerations: []
              nodeSelector:
                node-role: agent
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: common
              operator: Exists
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: agent

  - it: merges global, common and nested image pull secrets
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        imagePullSecrets:
          - global-secret
      common:
        imagePullSecrets:
          - name: common-secret
      controller:
        provider:
          istio:
            agent:
              imagePullSecrets:
                - name: agent-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-secret
            - name: common-secret
            - name: agent-secret

  - it: applies the namespace override to the agent ServiceAccount
    template: templates/ztunnel-log-reader/serviceaccount.yaml
    release:
      namespace: ignored-release-namespace
    set:
      namespaceOverride: agent-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: agent-namespace

  - it: renders merged ServiceAccount annotations on the agent identity
    template: templates/ztunnel-log-reader/serviceaccount.yaml
    set:
      global:
        serviceAccount:
          annotations:
            example.com/global: global
            example.com/role: global
      common:
        serviceAccount:
          annotations:
            example.com/common: common
            example.com/role: common
      controller:
        provider:
          istio:
            agent:
              serviceAccount:
                annotations:
                  example.com/role: agent
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/global: global
            example.com/common: common
            example.com/role: agent

  - it: renders fixed agent component labels despite user label collisions
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              labels:
                app.kubernetes.io/component: overridden
              podLabels:
                app.kubernetes.io/component: overridden
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: agent
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: agent

  - it: does not render ztunnel log readers or agent-hop material for Cilium
    set:
      controller:
        provider:
          name: cilium
          istio:
            agent:
              enabled: true
              grpcPort: 50123
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
          any: true
        template: templates/controller/deployment.yaml

  - it: does not render ztunnel log readers or agent-hop material for Calico
    set:
      controller:
        provider:
          name: calico
          istio:
            agent:
              enabled: true
              grpcPort: 50123
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
          any: true
        template: templates/controller/deployment.yaml
---
suite: ztunnel log reader has no Kubernetes RBAC bindings
templates:
  - templates/controller/rolebinding.yaml
  - templates/controller/leader-election-rbac.yaml
  - templates/controller/metrics-auth-rbac.yaml
  - templates/controller/metrics-reader-rbac.yaml
  - templates/controller/provider-tls-rbac.yaml
tests:
  - it: does not grant Kubernetes permissions to the agent ServiceAccount
    documentSelector:
      path: kind
      pattern: "^(RoleBinding|ClusterRoleBinding)$"
      skipEmptyTemplates: true
      matchMany: true
    asserts:
      - notContains:
          path: subjects
          content:
            kind: ServiceAccount
            name: RELEASE-NAME-network-enforcer-agent
          any: true
---
suite: full chart render without inactive Istio values
templates:
  - templates/**/*.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: audit
  namespace: audit
tests:
  - it: renders Cilium when the inactive Istio values are removed
    set:
      controller:
        provider:
          name: cilium
          istio: null
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
          any: true
        template: templates/controller/deployment.yaml

  - it: renders Calico when the inactive Istio values are removed
    set:
      controller:
        provider:
          name: calico
          istio: null
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-mtls-cert-dir=/etc/network-enforcer/certs
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: grpc-certs
          any: true
        template: templates/controller/deployment.yaml
