syntax = "proto3";

package agent.v1;

option go_package = "github.com/kubewarden/network-enforcer/proto/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// One logical consumer scrapes each agent. Events are in memory only;
// restart, overflow, or a lost response can lose events without replay.
service AgentService {
  // Drains all retained events before replying, newest-recorded first.
  rpc ScrapeEvents(ScrapeEventsRequest) returns (ScrapeEventsResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message ScrapeEventsRequest {}

message ScrapeEventsResponse {
  repeated Event events = 1;
}

message Event {
  reserved 1;
  reserved "seq";

  // CRI observation time; absent if it cannot be parsed or represented.
  google.protobuf.Timestamp observed_at = 2;
  oneof kind {
    LearnEvent learn = 3;
    PolicyEvent policy = 4;
  }
  // Original ztunnel JSON body, excluding the CRI prefix.
  bytes raw_record = 5;
}

message LearnEvent {
  string source_identity = 1;
  // Preserve absent/null versus present-but-empty fields.
  optional string destination_name = 2;
  optional string destination_namespace = 3;
  // Preserve parser output, including absent or large port values.
  string destination_port = 4;
}

enum PolicyMode {
  POLICY_MODE_UNSPECIFIED = 0;
  POLICY_MODE_MONITOR = 1;
  POLICY_MODE_PROTECT = 2;
}

message PolicyEvent {
  PolicyMode mode = 1;
  string message = 2;
  string destination_namespaced_name = 3;
  string policy = 4;
  string source_address = 5;
}

message GetStatusRequest {}

// Read-only snapshot. Counters reset on process restart.
message GetStatusResponse {
  reserved 1, 2, 3, 4, 7;
  reserved "epoch", "acked_seq", "newest_seq", "oldest_seq", "max_age";

  uint64 buffered_events = 5;
  uint64 max_events = 6;
  // Cumulative buffer overwrites, not total end-to-end loss.
  uint64 dropped_events = 8;
  // Latest unique matcher hits; may include unopened paths, omit lost
  // descriptors, and lag rotation/removal until the next observation.
  repeated string current_log_files = 9;
  // All raw tailer records, including malformed and filtered records.
  uint64 received_events = 10;
}
