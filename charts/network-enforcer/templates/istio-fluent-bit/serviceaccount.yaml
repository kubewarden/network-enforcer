{{- if eq .Values.controller.provider.name "istio" }}
{{- $ctx := dict "root" $ "workload" "istioFluentBit" "component" "istio-fluent-bit" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
  namespace: {{ include "network-enforcer.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: istio-fluent-bit
    {{- include "network-enforcer.labels" . | nindent 4 }}
  {{- with include "network-enforcer.serviceAccountAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
{{- end }}
