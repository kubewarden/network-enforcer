# OpenTelemetry collector for the e2e tests.
# The chart does not deploy a collector. The e2e suite applies this manifest
# in the network enforcer namespace before it installs the chart.
# The receiver is plaintext gRPC, so the chart endpoint uses http://.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    connectors:
      count:
        logs:
          network_enforcer_policy_denies:
            description: "Total network policy deny events observed"
            conditions:
              - 'attributes["enforcement.provider"] != nil'
            attributes:
              - key: enforcement.provider
              # The emitter skips empty attributes, so every optional key needs
              # a default_value: without it the count connector drops the whole
              # datapoint instead of counting it with an empty label.
              - key: action
                default_value: ""
              - key: network.transport
                default_value: ""
              - key: source.workload.namespace
                default_value: ""
              - key: source.workload.name
                default_value: ""
              - key: destination.workload.namespace
                default_value: ""
              - key: destination.workload.name
                default_value: ""
              - key: destination.port
                default_value: 0
              # policy.ref.* are absent when the observation matched no
              # WorkloadNetworkPolicy, which is the key security signal and must
              # still be counted.
              - key: policy.ref.namespace
                default_value: ""
              - key: policy.ref.name
                default_value: ""
    processors:
      deltatocumulative: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      debug:
        verbosity: normal
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [count, debug]
        metrics:
          receivers: [count, otlp]
          processors: [deltatocumulative]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.164.0
        imagePullPolicy: IfNotPresent
        command:
        - /otelcol-contrib
        - --config=/etc/otel/config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 13133
        readinessProbe:
          httpGet:
            path: /
            port: 13133
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otel
          readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
  - name: prometheus
    port: 9090
    targetPort: prometheus
    protocol: TCP
