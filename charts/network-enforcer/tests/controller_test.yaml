suite: "Controller general configs"
templates:
  - templates/controller/deployment.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "uses default log level"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=info

  - it: "uses custom log level"
    set:
      controller:
        logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug

  - it: "uses default flow debug settings"
    set:
      controller:
        provider:
          # if the provider is not istio the container port will have index 0.
          name: cilium
        flowDumper:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-enabled=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-port=9080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-buffer-size=10000
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9080

  - it: "uses custom flow debug settings"
    set:
      controller:
        provider:
            # if the provider is istio the container port will have index 1.
          name: istio
        flowDumper:
          enabled: true
          port: 9084
          bufferSize: 1234
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-enabled=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-port=9084
      - contains:
          path: spec.template.spec.containers[0].args
          content: --flow-dumper-buffer-size=1234
      - equal:
            path: spec.template.spec.containers[0].ports[1].containerPort
            value: 9084
---
suite: "Render flow dumper service"
templates:
  - templates/controller/flow-dumper-service.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "not renders flow dumper service"
    set:
      controller:
        flowDumper:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders flow dumper service with custom port"
    set:
      controller:
        flowDumper:
          enabled: true
          port: 5555
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ports[0].port
          value: 5555
---
suite: "Workload names, default resources and schema"
templates:
  - templates/controller/deployment.yaml
  - templates/istio-fluent-bit/daemonset.yaml
  # Included only because the DaemonSet computes a checksum of the ConfigMap.
  - templates/istio-fluent-bit/configmap.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "should render default fluent-bit resources"
    template: "templates/istio-fluent-bit/daemonset.yaml"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

  - it: "should accept Kubernetes fields not listed in the values.yaml example"
    # values.schema.json references the upstream Kubernetes object schemas
    # (SecurityContext, PodSecurityContext, ResourceRequirements, Toleration,
    # EnvVar) for these fields, instead of listing every accepted key by hand.
    # This test sets one field per object that values.yaml does not show, to
    # prove the schema still accepts it. A schema regression here fails the
    # whole suite before any assert runs.
    template: "templates/controller/deployment.yaml"
    set:
      controller:
        containerSecurityContext:
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/audit.json
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "experimental"
            effect: "NoSchedule"
            tolerationSeconds: 30
        extraEnv:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - NET_BIND_SERVICE
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.localhostProfile
          value: profiles/audit.json
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 1Gi
      - equal:
          path: spec.template.spec.tolerations[0].tolerationSeconds
          value: 30
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: "should honor nameOverride"
    template: "templates/controller/deployment.yaml"
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: my-release-custom-name-controller-manager
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom-name

  - it: "should honor fullnameOverride"
    template: "templates/controller/deployment.yaml"
    set:
      fullnameOverride: custom-fullname
    asserts:
      - equal:
          path: metadata.name
          value: custom-fullname-controller-manager
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-fullname-controller-manager
