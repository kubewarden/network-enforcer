suite: "Provider TLS in controller deployment"
templates:
  - templates/controller/deployment.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "does not pass legacy Istio TLS settings to the controller"
    set:
      controller:
        provider:
          name: istio
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=issuer
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-dir=/etc/provider/certs
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "defaults calico to Goldmane's own key pair in calico-system"
    set:
      controller:
        provider:
          name: calico
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=existingSecret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=calico-system/goldmane-key-pair
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-configmap=calico-system/goldmane-ca-bundle
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-bundle-key=tigera-ca-bundle.crt

  - it: "defaults cilium to Cilium's own client Secret in kube-system"
    set:
      controller:
        provider:
          name: cilium
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=existingSecret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=kube-system/hubble-relay-client-certs
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-server-name=ui.hubble-relay.cilium.io
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=hubble-relay.kube-system.svc:443
  - it: "keeps cilium on plaintext port 80 in insecure mode"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=insecure
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=hubble-relay.kube-system.svc:80
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=kube-system/hubble-relay-client-certs
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-server-name=ui.hubble-relay.cilium.io
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "requests a cilium client certificate from the issuer in issuer mode"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: issuer
              issuerRef:
                name: hubble-ca
                kind: ClusterIssuer
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=issuer
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-dir=/etc/provider/certs
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-server-name=ui.hubble-relay.cilium.io
      - contains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: hubble-ca
                csi.cert-manager.io/issuer-kind: ClusterIssuer
                csi.cert-manager.io/issuer-group: cert-manager.io
                csi.cert-manager.io/dns-names: network-enforcer.hubble-relay.cilium.io
                csi.cert-manager.io/fs-group: "65532"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: provider-tls
            mountPath: /etc/provider/certs
            readOnly: true

  - it: "overrides the cilium server name"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              serverName: relay.kube-system.svc.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-server-name=relay.kube-system.svc.cluster.local

  - it: "fails when a server name is set on an insecure hop"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: relay.kube-system.svc.cluster.local
    asserts:
      - failedTemplate:
          errorMessage: controller.provider.cilium.tls.serverName is not accepted when controller.provider.cilium.tls.mode=insecure

  - it: "ignores legacy Istio issuer TLS settings on the controller"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: issuer
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=issuer
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-dir=/etc/provider/certs
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "does not use a custom legacy Istio provider issuer for the controller"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: issuer
              issuerRef:
                name: my-issuer
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=issuer
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-dir=/etc/provider/certs
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "keeps controller-manager DNS names for a provider without dedicated names"
    set:
      controller:
        provider:
          name: calico
          calico:
            tls:
              mode: issuer
              issuerRef:
                name: my-issuer
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: my-issuer
                csi.cert-manager.io/issuer-kind: Issuer
                csi.cert-manager.io/issuer-group: cert-manager.io
                csi.cert-manager.io/dns-names: my-release-network-enforcer-controller-manager
                csi.cert-manager.io/fs-group: "65532"

  - it: "does not mount an Istio legacy provider Secret on the controller"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: existingSecret
              existingSecret:
                name: my-provider-certs
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "does not pass the ignored Istio Secret identity to the controller"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: existingSecret
              existingSecret: {}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=existingSecret
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "does not pass the legacy Istio provider Secret namespace to the controller"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: existingSecret
              existingSecret:
                name: provider-tls-certs
                namespace: other-namespace
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=existingSecret
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=other-namespace/provider-tls-certs
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls

  - it: "passes a cross-namespace existingSecret as flags"
    set:
      controller:
        provider:
          name: calico
          calico:
            tls:
              mode: existingSecret
              existingSecret:
                name: goldmane-key-pair
                namespace: calico-system
                caBundleConfigMap: goldmane-ca-bundle
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=calico-system/goldmane-key-pair
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-configmap=calico-system/goldmane-ca-bundle
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-bundle-key=tigera-ca-bundle.crt

---
suite: "Provider TLS in istio fluent-bit"
templates:
  - templates/istio-fluent-bit/configmap.yaml
  - templates/istio-fluent-bit/daemonset.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "enables TLS and points at mounted certs in issuer mode"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: issuer
    documentSelector:
      path: kind
      value: ConfigMap
      skipEmptyTemplates: true
    asserts:
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '(?m)^\s+Tls\s+On\s*$'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '(?m)^\s+Tls.verify\s+On\s*$'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '(?m)^\s+Tls.ca_file\s+/etc/provider/certs/ca.crt\s*$'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '(?m)^\s+Tls.crt_file\s+/etc/provider/certs/tls.crt\s*$'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '(?m)^\s+Tls.key_file\s+/etc/provider/certs/tls.key\s*$'

  - it: "mounts a CSI client certificate on the DaemonSet in issuer mode"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: issuer
    documentSelector:
      path: kind
      value: DaemonSet
      skipEmptyTemplates: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: provider-tls
            mountPath: /etc/provider/certs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: provider-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                csi.cert-manager.io/issuer-name: my-release-network-enforcer-ca
                csi.cert-manager.io/issuer-kind: Issuer
                csi.cert-manager.io/issuer-group: cert-manager.io
                csi.cert-manager.io/dns-names: my-release-network-enforcer-istio-fluent-bit
---
suite: "CA issuer for provider TLS"
templates:
  - templates/cert-manager.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "creates the CA issuer for issuer mode"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: issuer
    asserts:
      - hasDocuments:
          count: 3

  - it: "creates the CA issuer for Cilium issuer mode"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: issuer
    asserts:
      - hasDocuments:
          count: 3

  - it: "creates the CA issuer for the webhook in insecure mode"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: ""
    asserts:
      - hasDocuments:
          count: 3

  - it: "still creates the CA issuer when an OpenTelemetry endpoint is set"
    set:
      global:
        otel:
          endpoint: https://collector:4317
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: ""
    asserts:
      - hasDocuments:
          count: 3

---
suite: "Provider TLS RBAC"
templates:
  - templates/controller/provider-tls-rbac.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "renders no RBAC for an insecure hop"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders no RBAC for issuer mode"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: issuer
              issuerRef:
                name: hubble-ca
    asserts:
      - hasDocuments:
          count: 0

  - it: "renders no RBAC for a Secret mounted from the release namespace"
    set:
      controller:
        provider:
          istio:
            tls:
              mode: existingSecret
              existingSecret:
                name: my-provider-certs
    asserts:
      - hasDocuments:
          count: 0

  - it: "scopes the Role to Cilium's client Secret in kube-system by default"
    set:
      controller:
        provider:
          name: cilium
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: kube-system
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - hubble-relay-client-certs
              verbs:
                - get

  - it: "binds the controller ServiceAccount from the release namespace"
    set:
      controller:
        provider:
          name: cilium
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.namespace
          value: kube-system
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: my-release-network-enforcer-controller-manager
              namespace: my-namespace

  - it: "scopes the Role to Goldmane's key pair and CA bundle in calico-system by default"
    set:
      controller:
        provider:
          name: calico
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: calico-system
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - goldmane-key-pair
              verbs:
                - get
            - apiGroups:
                - ""
              resources:
                - configmaps
              resourceNames:
                - goldmane-ca-bundle
              verbs:
                - get

  - it: "binds the controller ServiceAccount into calico-system for Goldmane"
    set:
      controller:
        provider:
          name: calico
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.namespace
          value: calico-system
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: my-release-network-enforcer-controller-manager
              namespace: my-namespace

  - it: "grants the CA bundle ConfigMap when one is configured"
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              existingSecret:
                name: hubble-relay-client-certs
                namespace: kube-system
                caBundleConfigMap: hubble-ca-bundle
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            resourceNames:
              - hubble-ca-bundle
            verbs:
              - get
