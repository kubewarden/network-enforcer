suite: Provider endpoints in controller deployment
templates:
  - templates/controller/deployment.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: renders Istio agent discovery without a push listener
    set:
      controller:
        provider:
          name: istio
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-namespace=my-namespace
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-port=50052
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=4317
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: uses Cilium default endpoint
    set:
      controller:
        provider:
          name: cilium
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=hubble-relay.kube-system.svc:443
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: uses Cilium plaintext default endpoint in insecure mode
    set:
      controller:
        provider:
          name: cilium
          cilium:
            tls:
              mode: insecure
              serverName: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=hubble-relay.kube-system.svc:80
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: uses Cilium custom endpoint override
    set:
      controller:
        provider:
          name: cilium
          cilium:
            endpoint: example:9032
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=example:9032
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: uses Calico default endpoint and TLS settings
    set:
      controller:
        provider:
          name: calico
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=goldmane.calico-system.svc:7443
      - notExists:
          path: spec.template.spec.containers[0].ports
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-mode=existingSecret
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-cert-secret=calico-system/goldmane-key-pair
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-configmap=calico-system/goldmane-ca-bundle
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-tls-ca-bundle-key=tigera-ca-bundle.crt

  - it: uses Calico custom endpoint override
    set:
      controller:
        provider:
          name: calico
          calico:
            endpoint: example:9032
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider-endpoint=example:9032
      - notExists:
          path: spec.template.spec.containers[0].ports
