{{- $ctx := dict "root" $ "workload" "controller" "component" "controller" "fixedPodAnnotations" (dict "kubectl.kubernetes.io/default-container" "manager") }}
{{- $w := .Values.controller }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-enforcer.fullname" . }}-controller-manager
  namespace: {{ include "network-enforcer.namespace" . | quote }}
  {{- include "network-enforcer.workloadLabels" $ctx | nindent 2 }}
  {{- with include "network-enforcer.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      {{- include "network-enforcer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "network-enforcer.podLabels" $ctx | nindent 6 }}
      {{- with include "network-enforcer.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      {{- with include "network-enforcer.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      containers:
      - args:
        {{- with include "network-enforcer.logLevel" $ctx }}
        - --log-level={{ . }}
        {{- end }}
        - --flow-dumper-enabled={{ $w.flowDumper.enabled }}
        - --flow-dumper-port={{ $w.flowDumper.port }}
        - --flow-dumper-buffer-size={{ $w.flowDumper.bufferSize }}
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:{{ include "network-enforcer.controller.probePort" . }}
        - --provider-name={{ $w.provider.name }}
        - --provider-endpoint={{ include "network-enforcer.controller.providerEndpoint" . }}
        {{- $tlsArgs := include "network-enforcer.provider.tls.args" . | trim }}
        {{- if $tlsArgs }}
        {{- $tlsArgs | nindent 8 }}
        {{- end }}
        - --wnp-status-reconciler-update-interval={{ $w.wnpStatusUpdateInterval }}
        command:
        - /controller
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        {{- with include "network-enforcer.otelEnv" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "network-enforcer.extraEnv" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "network-enforcer.extraEnvFrom" $ctx }}{{ . | nindent 8 }}{{ end }}
        image: '{{ template "system_default_registry" $ctx }}{{ $w.image.repository }}:{{ $w.image.tag }}'
        imagePullPolicy: {{ include "network-enforcer.imagePullPolicy" $ctx }}
        name: manager
        {{- if or (eq $w.provider.name "istio") $w.flowDumper.enabled }}
        ports:
        {{- if eq $w.provider.name "istio" }}
        - containerPort: {{ include "network-enforcer.controller.istioPort" . }}
          name: otlp-grpc
          protocol: TCP
        {{- end }}
        {{- if $w.flowDumper.enabled }}
        - containerPort: {{ $w.flowDumper.port }}
          name: flow-dumper
          protocol: TCP
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ include "network-enforcer.controller.probePort" . }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ include "network-enforcer.controller.probePort" . }}
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with $w.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $w.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- $tlsMounts := include "network-enforcer.provider.tls.volumeMounts" . | trim }}
        {{- if $tlsMounts }}
        {{- $tlsMounts | nindent 8 }}
        {{- end }}
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
        {{- with include "network-enforcer.otelVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "network-enforcer.extraVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
      volumes:
      {{- $tlsVolumes := include "network-enforcer.provider.tls.volumes" . | trim }}
      {{- if $tlsVolumes }}
      {{- $tlsVolumes | nindent 6 }}
      {{- end }}
      - name: webhook-certs
        csi:
          driver: csi.cert-manager.io
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/issuer-name: {{ include "network-enforcer.caIssuerName" . }}
            csi.cert-manager.io/issuer-kind: Issuer
            csi.cert-manager.io/dns-names: {{ include "network-enforcer.webhookServiceName" . }}.{{ include "network-enforcer.namespace" . }}.svc
      {{- with include "network-enforcer.otelVolumes" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.extraVolumes" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "network-enforcer.fullname" . }}-controller-manager
      terminationGracePeriodSeconds: 10
