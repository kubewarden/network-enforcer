suite: "Values contract: namespaceOverride"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
  - templates/ztunnel-log-reader/serviceaccount.yaml
  - templates/controller/service.yaml
  - templates/controller/flow-dumper-service.yaml
  - templates/controller/serviceaccount.yaml
  - templates/cert-manager.yaml
  - templates/controller/webhook.yaml
release:
  name: rel
  namespace: release-ns
set:
  controller:
    flowDumper:
      enabled: true
tests:
  - it: uses the release namespace by default for controller, agent, and supporting resources
    asserts:
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/controller/service.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/controller/flow-dumper-service.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/controller/serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: release-ns
        template: templates/cert-manager.yaml
      - equal:
          path: webhooks[0].clientConfig.service.namespace
          value: release-ns
        template: templates/controller/webhook.yaml

  - it: applies namespaceOverride to namespaced resources and webhook references
    set:
      namespaceOverride: other
    asserts:
      - equal:
          path: metadata.namespace
          value: other
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/ztunnel-log-reader/serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/controller/service.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/controller/flow-dumper-service.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/controller/serviceaccount.yaml
      - equal:
          path: metadata.namespace
          value: other
        template: templates/cert-manager.yaml
      - equal:
          path: webhooks[0].clientConfig.service.namespace
          value: other
        template: templates/controller/webhook.yaml

  - it: renders numeric release namespace strings in workload metadata
    release:
      namespace: "123"
    asserts:
      - equal:
          path: metadata.namespace
          value: "123"
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: "123"
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: renders numeric namespaceOverride strings in workload metadata
    set:
      namespaceOverride: "123"
    asserts:
      - equal:
          path: metadata.namespace
          value: "123"
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: "123"
        template: templates/ztunnel-log-reader/daemonset.yaml
