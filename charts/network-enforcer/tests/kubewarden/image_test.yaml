suite: "Values contract: controller and nested agent images"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
workloads: &workloads
  path: apiVersion
  value: apps/v1
  skipEmptyTemplates: true
  matchMany: true
tests:
  - it: renders the controller and agent default images
    documentSelector: *workloads
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kubewarden/network-enforcer/controller:[^:/]+$"
        template: templates/controller/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/kubewarden/network-enforcer/agent:[^:/]+$"
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: uses the controller image pull policy only for the controller
    templates:
      - templates/controller/deployment.yaml
      - templates/ztunnel-log-reader/daemonset.yaml
    set:
      controller:
        image:
          pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: renders custom controller and agent repositories and tags independently
    documentSelector: *workloads
    set:
      controller:
        image:
          repository: example/controller
          tag: v9.9.9-controller
        provider:
          istio:
            agent:
              image:
                repository: example/agent
                tag: v9.9.9-agent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/controller:v9.9.9-controller
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/agent:v9.9.9-agent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: gives the global registry precedence over workload registries
    documentSelector: *workloads
    set:
      global:
        imageRegistry: mirror.example.com
      controller:
        image:
          registry: controller.example.com
          tag: v1
        provider:
          istio:
            agent:
              image:
                registry: agent.example.com
                tag: v2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kubewarden/network-enforcer/controller:v1
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kubewarden/network-enforcer/agent:v2
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: uses the nested agent registry when the global registry is empty
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        imageRegistry: ""
      controller:
        provider:
          istio:
            agent:
              image:
                registry: agent.example.com
                tag: v9.9.9-agent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: agent.example.com/kubewarden/network-enforcer/agent:v9.9.9-agent

  - it: uses the controller registry when the global registry is empty
    template: templates/controller/deployment.yaml
    set:
      global:
        imageRegistry: ""
      controller:
        image:
          registry: controller.example.com
          tag: v9.9.9-controller
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: controller.example.com/kubewarden/network-enforcer/controller:v9.9.9-controller

  - it: renders no registry prefix when all registries are empty
    documentSelector: *workloads
    set:
      global:
        imageRegistry: ""
      controller:
        image:
          registry: ""
          tag: v9.9.9-controller
        provider:
          istio:
            agent:
              image:
                registry: ""
                tag: v9.9.9-agent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: kubewarden/network-enforcer/controller:v9.9.9-controller
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: kubewarden/network-enforcer/agent:v9.9.9-agent
        template: templates/ztunnel-log-reader/daemonset.yaml
