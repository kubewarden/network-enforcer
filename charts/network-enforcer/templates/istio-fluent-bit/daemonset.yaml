{{- if eq .Values.controller.provider.name "istio" }}
{{- $ctx := dict "root" $ "workload" "istioFluentBit" "component" "istio-fluent-bit" "fixedPodAnnotations" (dict "checksum/config" (include (print $.Template.BasePath "/istio-fluent-bit/configmap.yaml") . | sha256sum)) }}
{{- $w := .Values.istioFluentBit }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
  namespace: {{ include "network-enforcer.namespace" . | quote }}
  {{- include "network-enforcer.workloadLabels" $ctx | nindent 2 }}
  {{- with include "network-enforcer.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: istio-fluent-bit
      {{- include "network-enforcer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "network-enforcer.podLabels" $ctx | nindent 6 }}
      {{- with include "network-enforcer.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      {{- with include "network-enforcer.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "network-enforcer.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      serviceAccountName: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: '{{ template "system_default_registry" $ctx }}{{ $w.image.repository }}:{{ $w.image.tag }}'
          imagePullPolicy: {{ include "network-enforcer.imagePullPolicy" $ctx }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with include "network-enforcer.extraEnv" $ctx }}{{ . | nindent 12 }}{{ end }}
          {{- with include "network-enforcer.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/scripts/ztunnel_to_otel.lua
              subPath: ztunnel_to_otel.lua
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
            {{- $tlsMounts := include "network-enforcer.istio.fluentBit.tls.volumeMounts" . | trim }}
            {{- if $tlsMounts }}
            {{- $tlsMounts | nindent 12 }}
            {{- end }}
            {{- with include "network-enforcer.extraVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: state
          emptyDir: {}
        {{- $tlsVolumes := include "network-enforcer.istio.fluentBit.tls.volumes" . | trim }}
        {{- if $tlsVolumes }}
        {{- $tlsVolumes | nindent 8 }}
        {{- end }}
        {{- with include "network-enforcer.extraVolumes" $ctx }}{{ . | nindent 8 }}{{ end }}
{{- end }}
