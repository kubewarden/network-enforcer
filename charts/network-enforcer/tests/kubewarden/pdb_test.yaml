suite: "Values contract: PodDisruptionBudgets"
templates:
  - "templates/controller/pdb.yaml"
tests:
  - it: "should not render a PodDisruptionBudget by default"
    asserts:
      - hasDocuments:
          count: 0

  - it: "should not render a PodDisruptionBudget when controller.podDisruptionBudget is empty"
    set:
      controller:
        podDisruptionBudget: {}
    asserts:
      - hasDocuments:
          count: 0

  # network-enforcer has no PodDisruptionBudget for the fluent-bit DaemonSet.
  - it: "should render a PodDisruptionBudget for each workload that sets one"
    release:
      name: rel
    set:
      controller:
        podDisruptionBudget:
          minAvailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: "spec.minAvailable"
          value: 1
      - notExists:
          path: "spec.maxUnavailable"
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/name: network-enforcer
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller

  # network-enforcer cases
  - it: "should render the controller PodDisruptionBudget with minAvailable"
    release:
      name: rel
      namespace: ns
    set:
      controller:
        podDisruptionBudget:
          minAvailable: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: rel-network-enforcer-controller-manager
      - equal:
          path: metadata.namespace
          value: ns
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: controller
            app.kubernetes.io/name: network-enforcer
            app.kubernetes.io/instance: rel

  - it: "should render the controller PodDisruptionBudget with maxUnavailable"
    release:
      name: rel
    set:
      controller:
        podDisruptionBudget:
          maxUnavailable: 25%
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.maxUnavailable
          value: 25%
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: controller
            app.kubernetes.io/name: network-enforcer
            app.kubernetes.io/instance: rel

  - it: "should not render a PodDisruptionBudget from global or common"
    set:
      global:
        podDisruptionBudget:
          minAvailable: 1
      common:
        podDisruptionBudget:
          minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0
