suite: "Values contract: common settings on the controller and Istio agent"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
workloads: &workloads
  path: apiVersion
  value: apps/v1
  skipEmptyTemplates: true
  matchMany: true
tests:
  - it: applies common scheduling, pull secrets, and extra environment to both workloads
    documentSelector: *workloads
    set:
      common:
        tolerations:
          - key: from-common
            operator: Exists
        nodeSelector:
          kubernetes.io/os: linux
        imagePullSecrets:
          - registry-credentials
        extraEnv:
          - name: FROM_COMMON
            value: "yes"
      controller:
        provider:
          istio:
            agent:
              tolerations: []
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: from-common
              operator: Exists
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FROM_COMMON
            value: "yes"

  - it: applies common image pull policy and labels to both workloads
    documentSelector: *workloads
    set:
      common:
        imagePullPolicy: Always
        labels:
          team: security
        podLabels:
          tier: policy
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: metadata.labels.team
          value: security
      - equal:
          path: spec.template.metadata.labels.tier
          value: policy

  - it: renders common log level and telemetry only on the controller
    templates:
      - templates/controller/deployment.yaml
    set:
      common:
        logLevel: debug
        otel:
          endpoint: https://collector.example.com:4317
          caSecretName: otel-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: https://collector.example.com:4317
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: otel-ca

  - it: does not add log level or telemetry settings to the agent
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      common:
        logLevel: debug
        otel:
          endpoint: https://collector.example.com:4317
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: applies common annotations, affinity, spread constraints, and additional sources to both workloads
    documentSelector: *workloads
    set:
      common:
        annotations:
          example.com/owner: security
        podAnnotations:
          example.com/pod-owner: security
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: [amd64]
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        extraEnvFrom:
          - configMapRef:
              name: shared-env
        extraVolumes:
          - name: shared-config
            configMap:
              name: shared-config
        extraVolumeMounts:
          - name: shared-config
            mountPath: /etc/shared
            readOnly: true
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: security
      - equal:
          path: spec.template.metadata.annotations["example.com/pod-owner"]
          value: security
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: shared-env
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-config
            configMap:
              name: shared-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-config
            mountPath: /etc/shared
            readOnly: true
