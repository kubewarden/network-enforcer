suite: "Values contract: nested agent merges with global and common settings"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
workloads: &workloads
  path: apiVersion
  value: apps/v1
  skipEmptyTemplates: true
  matchMany: true
tests:
  - it: merges maps from global, common, and the nested agent block
    set:
      global:
        nodeSelector:
          from-global: "yes"
          shared: global
      common:
        nodeSelector:
          from-common: "yes"
          shared: common
      controller:
        provider:
          istio:
            agent:
              nodeSelector:
                from-agent: "yes"
                shared: agent
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            from-global: "yes"
            from-common: "yes"
            shared: common
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            from-global: "yes"
            from-common: "yes"
            from-agent: "yes"
            shared: agent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: deep merges global, common, and agent affinity maps
    documentSelector: *workloads
    set:
      global:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: global.example.com/pool
                      operator: In
                      values: [shared]
      common:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: network-enforcer
                topologyKey: kubernetes.io/hostname
      controller:
        provider:
          istio:
            agent:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: agent.example.com/zone
                            operator: In
                            values: [east]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: global.example.com/pool
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: selects agent tolerations over common unless an empty agent list requests fallback
    set:
      common:
        tolerations:
          - key: common
            operator: Exists
      controller:
        tolerations:
          - key: controller
            operator: Exists
        provider:
          istio:
            agent:
              tolerations: []
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: controller
              operator: Exists
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: common
              operator: Exists
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: concatenates global, common, and workload image pull secrets and extra environment
    set:
      global:
        imagePullSecrets: [global-secret]
        extraEnv:
          - name: FROM_GLOBAL
            value: global
      common:
        imagePullSecrets:
          - name: common-secret
        extraEnv:
          - name: FROM_COMMON
            value: common
      controller:
        provider:
          istio:
            agent:
              imagePullSecrets:
                - name: agent-secret
              extraEnv:
                - name: FROM_AGENT
                  value: agent
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-secret
            - name: common-secret
            - name: agent-secret
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FROM_GLOBAL
            value: global
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FROM_COMMON
            value: common
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FROM_AGENT
            value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: prefers the agent image pull policy over common and global
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        imagePullPolicy: IfNotPresent
      common:
        imagePullPolicy: Always
      controller:
        provider:
          istio:
            agent:
              image:
                pullPolicy: Never
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Never

  - it: keeps the default agent toleration ahead of global tolerations
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        tolerations:
          - key: global
            operator: Exists
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - operator: Exists

  - it: prefers workload then common then global scalar values and falls back when empty
    template: templates/controller/deployment.yaml
    set:
      global:
        logLevel: error
      common:
        logLevel: warn
      controller:
        logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug

  - it: falls back past an empty workload scalar
    template: templates/controller/deployment.yaml
    set:
      global:
        logLevel: error
      common:
        logLevel: warn
      controller:
        logLevel: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=warn

  - it: keeps fixed controller labels and selector under user label collisions
    template: templates/controller/deployment.yaml
    release:
      name: rel
    set:
      global:
        labels:
          app.kubernetes.io/name: other
        podLabels:
          app.kubernetes.io/name: other
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: network-enforcer
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: network-enforcer
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: network-enforcer
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller

  - it: keeps fixed controller pod annotations over hostile user values
    template: templates/controller/deployment.yaml
    set:
      global:
        podAnnotations:
          kubectl.kubernetes.io/default-container: hostile
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: manager
