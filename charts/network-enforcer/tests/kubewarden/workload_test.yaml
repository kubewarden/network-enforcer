suite: "Values contract: controller and nested agent workloads"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
workloads: &workloads
  path: apiVersion
  value: apps/v1
  skipEmptyTemplates: true
  matchMany: true
tests:
  - it: renders controller and agent resource overrides on their respective workloads
    documentSelector: *workloads
    set:
      controller:
        resources:
          limits:
            cpu: "1"
        podSecurityContext:
          fsGroup: 1001
        containerSecurityContext:
          runAsUser: 1001
        provider:
          istio:
            agent:
              resources:
                limits:
                  memory: 4Gi
              containerSecurityContext:
                runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1001
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: keeps agent-specific extra volumes and mounts off the controller
    documentSelector: *workloads
    set:
      controller:
        provider:
          istio:
            agent:
              extraVolumes:
                - name: agent-config
                  configMap:
                    name: agent-config
              extraVolumeMounts:
                - name: agent-config
                  mountPath: /etc/agent
                  readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: agent-config
            configMap:
              name: agent-config
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: agent-config
            mountPath: /etc/agent
            readOnly: true
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: agent-config
          any: true
        template: templates/controller/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: agent-config
          any: true
        template: templates/controller/deployment.yaml

  - it: renders the controller and agent with distinct workload labels
    documentSelector: *workloads
    set:
      controller:
        labels:
          workload: controller
        provider:
          istio:
            agent:
              labels:
                workload: agent
    asserts:
      - equal:
          path: metadata.labels.workload
          value: controller
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.labels.workload
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: renders workload-specific tolerations and node selectors
    documentSelector: *workloads
    set:
      controller:
        tolerations:
          - key: controller
            operator: Exists
        nodeSelector:
          workload: controller
        provider:
          istio:
            agent:
              tolerations:
                - key: agent
                  operator: Exists
              nodeSelector:
                workload: agent
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: controller
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.nodeSelector.workload
          value: controller
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.nodeSelector.workload
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: preserves agent mTLS discovery flags and configurable gRPC port
    set:
      controller:
        provider:
          istio:
            agent:
              grpcPort: 50123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-grpc-port=50123
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-port=50123
        template: templates/ztunnel-log-reader/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-expected-client-san=RELEASE-NAME-network-enforcer-controller
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: keeps controller-only affinity and extra volumes off the agent
    documentSelector: *workloads
    set:
      controller:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        extraEnvFrom:
          - secretRef:
              name: controller-env
        extraVolumes:
          - name: controller-data
            emptyDir: {}
        extraVolumeMounts:
          - name: controller-data
            mountPath: /controller-data
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: controller-env
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: controller-data
            emptyDir: {}
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: controller-data
            mountPath: /controller-data
        template: templates/controller/deployment.yaml
      - notExists:
          path: spec.template.spec.affinity
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: controller-data
          any: true
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: controller-data
          any: true
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: renders nested agent topology spread constraints
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      controller:
        provider:
          istio:
            agent:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: renders nested agent annotations and envFrom without changing the controller
    documentSelector: *workloads
    set:
      controller:
        provider:
          istio:
            agent:
              annotations:
                example.com/workload: agent
              podAnnotations:
                example.com/pod: agent
              podLabels:
                tier: agent
              extraEnvFrom:
                - secretRef:
                    name: agent-environment
    asserts:
      - equal:
          path: metadata.annotations["example.com/workload"]
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.metadata.annotations["example.com/pod"]
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.metadata.labels.tier
          value: agent
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: agent-environment
        template: templates/ztunnel-log-reader/daemonset.yaml
      - notExists:
          path: metadata.annotations["example.com/workload"]
        template: templates/controller/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: templates/controller/deployment.yaml
