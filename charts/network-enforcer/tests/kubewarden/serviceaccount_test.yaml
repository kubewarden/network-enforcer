suite: "Values contract: ServiceAccounts"
templates:
  - "templates/controller/serviceaccount.yaml"
  - "templates/istio-fluent-bit/serviceaccount.yaml"
tests:
  - it: "should render global.serviceAccount.annotations on every ServiceAccount"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: scanner
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: scanner

  # network-enforcer cases
  - it: "should render no ServiceAccount annotations by default"
    asserts:
      - notExists:
          path: "metadata.annotations"

  - it: "should render common.serviceAccount.annotations on every ServiceAccount"
    set:
      common:
        serviceAccount:
          annotations:
            example.com/role: common
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: common

  - it: "should render a workload serviceAccount.annotations on its own ServiceAccount only"
    set:
      istioFluentBit:
        serviceAccount:
          annotations:
            example.com/role: fluent-bit
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: fluent-bit
        template: "templates/istio-fluent-bit/serviceaccount.yaml"
      - notExists:
          path: "metadata.annotations"
        template: "templates/controller/serviceaccount.yaml"

  - it: "should render controller.serviceAccount.annotations on the controller ServiceAccount only"
    set:
      controller:
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123:role/test
    asserts:
      - equal:
          path: "metadata.annotations[\"eks.amazonaws.com/role-arn\"]"
          value: arn:aws:iam::123:role/test
        template: "templates/controller/serviceaccount.yaml"
      - notExists:
          path: "metadata.annotations"
        template: "templates/istio-fluent-bit/serviceaccount.yaml"

  - it: "should merge serviceAccount.annotations, with the workload winning on a duplicate key"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: global
            example.com/global: "yes"
      common:
        serviceAccount:
          annotations:
            example.com/role: common
            example.com/common: "yes"
      controller:
        serviceAccount:
          annotations:
            example.com/role: controller
    asserts:
      - equal:
          path: "metadata.annotations"
          value:
            example.com/role: controller
            example.com/global: "yes"
            example.com/common: "yes"
        template: "templates/controller/serviceaccount.yaml"
      - equal:
          path: "metadata.annotations"
          value:
            example.com/role: common
            example.com/global: "yes"
            example.com/common: "yes"
        template: "templates/istio-fluent-bit/serviceaccount.yaml"
