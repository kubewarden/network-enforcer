suite: "Values contract: global settings on the controller and Istio agent"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
workloads: &workloads
  path: apiVersion
  value: apps/v1
  skipEmptyTemplates: true
  matchMany: true
tests:
  - it: applies global scheduling, image pull secrets, and environment to both workloads
    documentSelector: *workloads
    set:
      global:
        tolerations:
          - key: dedicated
            operator: Exists
            effect: NoSchedule
        nodeSelector:
          kubernetes.io/os: linux
        imagePullSecrets:
          - name: registry-credentials
        extraEnv:
          - name: HTTPS_PROXY
            value: http://proxy:3128
      controller:
        provider:
          istio:
            agent:
              tolerations: []
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Exists
              effect: NoSchedule
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://proxy:3128

  - it: applies global image registry, pull policy, labels, and pod annotations
    documentSelector: *workloads
    set:
      global:
        imageRegistry: mirror.example.com
        imagePullPolicy: Always
        labels:
          team: security
        podLabels:
          tier: policy
        podAnnotations:
          example.com/owner: network-enforcer
      controller:
        image:
          tag: v1
        provider:
          istio:
            agent:
              image:
                tag: v2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kubewarden/network-enforcer/controller:v1
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kubewarden/network-enforcer/agent:v2
        template: templates/ztunnel-log-reader/daemonset.yaml
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: metadata.labels.team
          value: security
      - equal:
          path: spec.template.metadata.labels.tier
          value: policy
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: network-enforcer

  - it: renders global log level and telemetry only on the controller
    templates:
      - templates/controller/deployment.yaml
    set:
      global:
        logLevel: debug
        otel:
          endpoint: https://collector.example.com:4317
          caSecretName: otel-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: https://collector.example.com:4317
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: otel-ca

  - it: does not add log level or telemetry settings to the agent
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        logLevel: debug
        otel:
          endpoint: https://collector.example.com:4317
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: applies global annotations affinity spread and extra sources to both workloads
    documentSelector: *workloads
    set:
      global:
        annotations:
          example.com/owner: security
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: [amd64]
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        extraEnvFrom:
          - configMapRef:
              name: global-env
        extraVolumes:
          - name: global-volume
            emptyDir: {}
        extraVolumeMounts:
          - name: global-volume
            mountPath: /global
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: security
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: global-env
      - contains:
          path: spec.template.spec.volumes
          content:
            name: global-volume
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: global-volume
            mountPath: /global

  - it: skips empty and missing names in global imagePullSecrets
    documentSelector: *workloads
    set:
      global:
        imagePullSecrets:
          - ""
          - {}
          - name: ""
          - other: x
          - name: real-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: real-secret
