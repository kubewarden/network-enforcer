suite: "Values contract: PriorityClass"
templates:
  - templates/priorityclass/priorityclass.yaml
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
tests:
  - it: renders the shared PriorityClass and references it from controller and agent
    asserts:
      - hasDocuments:
          count: 1
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: metadata.name
          value: network-enforcer-priorityclass
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: value
          value: 1000000
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: globalDefault
          value: false
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: description
          value: PriorityClass for network-enforcer controller and agent pods.
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: keeps workload references when chart PriorityClass creation is disabled
    set:
      priorityClass:
        enabled: false
        name: existing-priority
    asserts:
      - hasDocuments:
          count: 0
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: existing-priority
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: existing-priority
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: omits the PriorityClass and references when priorityClass.name is empty
    set:
      priorityClass:
        name: ""
    asserts:
      - hasDocuments:
          count: 0
        template: templates/priorityclass/priorityclass.yaml
      - notExists:
          path: spec.template.spec.priorityClassName
        template: templates/controller/deployment.yaml
      - notExists:
          path: spec.template.spec.priorityClassName
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: applies a custom PriorityClass name and value to both workloads
    set:
      priorityClass:
        name: custom-priorityclass
        value: 500000
    asserts:
      - equal:
          path: metadata.name
          value: custom-priorityclass
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: value
          value: 500000
        template: templates/priorityclass/priorityclass.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: custom-priorityclass
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: custom-priorityclass
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: applies global priorityClassName to controller and agent
    set:
      global:
        priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: prefers common priorityClassName over global while allowing an agent override
    set:
      global:
        priorityClassName: global-priority
      common:
        priorityClassName: common-priority
      controller:
        provider:
          istio:
            agent:
              priorityClassName: agent-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: common-priority
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: agent-priority
        template: templates/ztunnel-log-reader/daemonset.yaml

  - it: honors the controller-only priority class without changing the agent class
    set:
      controller:
        priorityClassName: controller-priority
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: controller-priority
        template: templates/controller/deployment.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: network-enforcer-priorityclass
        template: templates/ztunnel-log-reader/daemonset.yaml
