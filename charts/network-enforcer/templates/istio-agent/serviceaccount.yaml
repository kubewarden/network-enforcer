{{- if eq (include "network-enforcer.provider.name" . | trim) "istio" }}
{{- $agent := .Values.controller.provider.istio.agent -}}
{{- if $agent.enabled }}
{{- $ctx := dict "root" $ "workload" "agent" "component" "agent" "workloadValues" $agent }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "network-enforcer.fullname" . }}-agent
  namespace: {{ include "network-enforcer.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: agent
    {{- include "network-enforcer.labels" . | nindent 4 }}
  {{- with include "network-enforcer.serviceAccountAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
