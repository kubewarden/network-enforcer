suite: "Values contract: controller OpenTelemetry export"
templates:
  - templates/controller/deployment.yaml
  - templates/ztunnel-log-reader/daemonset.yaml
tests:
  - it: renders no OTEL exporter configuration by default
    template: templates/controller/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT

  - it: renders endpoint and pod identity for controller export
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: http://collector:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://collector:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: K8S_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
          any: true

  - it: mounts CA and client secrets when configured
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: https://collector:4317
          caSecretName: otel-ca-secret
          clientCertificateSecretName: otel-client-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: /otel/tls/ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
            value: /otel/tls/client/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_CLIENT_KEY
            value: /otel/tls/client/tls.key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: otel-ca-secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-client-tls
            secret:
              secretName: otel-client-secret

  - it: prefers top-level otel over workload, common, and global settings
    template: templates/controller/deployment.yaml
    set:
      otel:
        endpoint: http://chart:4317
        caSecretName: chart-ca
      global:
        otel:
          endpoint: http://global:4317
          caSecretName: global-ca
      common:
        otel:
          endpoint: http://common:4317
      controller:
        otel:
          endpoint: http://controller:4317
          caSecretName: controller-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://chart:4317
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: chart-ca

  - it: does not emit OTEL exporter variables when only secret names are configured
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          caSecretName: otel-ca-secret
          clientCertificateSecretName: otel-client-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
          any: true

  - it: prefers workload otel over common and global
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: http://global:4317
      common:
        otel:
          endpoint: http://common:4317
      controller:
        otel:
          endpoint: http://workload:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://workload:4317

  - it: prefers common otel over global
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: http://global:4317
      common:
        otel:
          endpoint: http://common:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://common:4317

  - it: falls back to common otel when the workload endpoint is empty
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: http://global:4317
      common:
        otel:
          endpoint: http://common:4317
      controller:
        otel:
          endpoint: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://common:4317

  - it: resolves endpoint CA and client certificate fields independently
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: http://global:4317
          clientCertificateSecretName: global-client
      common:
        otel:
          clientCertificateSecretName: common-client
      controller:
        otel:
          caSecretName: workload-ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://global:4317
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: workload-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-client-tls
            secret:
              secretName: common-client

  - it: orders OTEL wiring before global, common, and workload extras
    template: templates/controller/deployment.yaml
    set:
      global:
        otel:
          endpoint: https://collector:4317
          caSecretName: otel-ca
          clientCertificateSecretName: otel-client
        extraEnv:
          - name: FROM_GLOBAL
            value: global
        extraVolumes:
          - name: volume-global
            emptyDir: {}
        extraVolumeMounts:
          - name: mount-global
            mountPath: /global
      common:
        extraEnv:
          - name: FROM_COMMON
            value: common
        extraVolumes:
          - name: volume-common
            emptyDir: {}
        extraVolumeMounts:
          - name: mount-common
            mountPath: /common
      controller:
        extraEnv:
          - name: FROM_CONTROLLER
            value: controller
        extraVolumes:
          - name: volume-controller
            emptyDir: {}
        extraVolumeMounts:
          - name: mount-controller
            mountPath: /controller
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: OTEL_EXPORTER_OTLP_ENDPOINT
      - equal:
          path: spec.template.spec.containers[0].env[7].name
          value: FROM_GLOBAL
      - equal:
          path: spec.template.spec.containers[0].env[8].name
          value: FROM_COMMON
      - equal:
          path: spec.template.spec.containers[0].env[9].name
          value: FROM_CONTROLLER
      - equal:
          path: spec.template.spec.volumes[2].name
          value: otel-ca
      - equal:
          path: spec.template.spec.volumes[4].name
          value: volume-global
      - equal:
          path: spec.template.spec.volumes[5].name
          value: volume-common
      - equal:
          path: spec.template.spec.volumes[6].name
          value: volume-controller
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: otel-ca
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[4].name
          value: mount-global
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[5].name
          value: mount-common
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[6].name
          value: mount-controller

  - it: does not add telemetry export settings to the agent
    template: templates/ztunnel-log-reader/daemonset.yaml
    set:
      global:
        otel:
          endpoint: https://collector:4317
          caSecretName: otel-ca-secret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
          any: true
